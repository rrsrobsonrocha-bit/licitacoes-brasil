<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - LicitaFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-white">Recuperação de Acesso</h1>
            <p class="text-xs text-slate-400 mt-1">Informe seu e-mail cadastrado para redefinir sua credencial</p>
        </div>

        <form method="POST" action="/recuperar-senha" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">E-mail</label>
                <input type="email" name="email" required 
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition text-sm">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition text-sm">
                Enviar Instruções
            </button>

            <div class="text-center pt-2">
                <a href="/login" class="text-xs text-slate-400 hover:text-white transition">Voltar ao Login</a>
            </div>
        </form>
    </div>
</body>
</html>
