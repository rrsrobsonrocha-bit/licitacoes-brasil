<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - LicitaFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white tracking-tight">Acesso ao LicitaFlow</h1>
            <p class="text-sm text-slate-400 mt-1">Gestão inteligente de contratações públicas</p>
        </div>

        <form method="POST" action="/login" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">E-mail ou Usuário</label>
                <input type="text" name="username" required 
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition text-sm">
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Senha</label>
                    <a href="/recuperar-senha" class="text-xs text-blue-400 hover:text-blue-300 transition">Esqueceu a senha?</a>
                </div>
                <div class="relative">
                    <input type="password" id="campo_senha" name="password" required 
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-4 pr-11 py-3 text-white focus:outline-none focus:border-blue-500 transition text-sm">
                    <button type="button" onclick="alternarVisibilidadeSenha()" 
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white transition cursor-pointer">
                        <svg id="icone_olho_aberto" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="icone_olho_fechado" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="flex items-center">
                <input type="checkbox" id="manter_conectado" name="remember_me" value="true"
                       class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-blue-600 focus:ring-0 cursor-pointer">
                <label for="manter_conectado" class="ml-2.5 text-xs text-slate-300 cursor-pointer select-none">
                    Manter conectado neste navegador
                </label>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition duration-150 text-sm">
                Acessar Plataforma
            </button>
        </form>
    </div>

    <script>
    function alternarVisibilidadeSenha() {
        const input = document.getElementById("campo_senha");
        const aberto = document.getElementById("icone_olho_aberto");
        const fechado = document.getElementById("icone_olho_fechado");
        if (input.type === "password") {
            input.type = "text";
            aberto.classList.remove("hidden");
            fechado.classList.add("hidden");
        } else {
            input.type = "password";
            aberto.classList.add("hidden");
            fechado.classList.remove("hidden");
        }
    }
    </script>
</body>
</html>
